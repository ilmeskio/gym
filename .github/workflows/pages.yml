name: Pubblica app e API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      # Expo genera cartelle con il trattino basso (_expo), che Jekyll scarterebbe.
      - run: touch apps/app/dist/.nojekyll
      # Pages serves only files: unknown paths such as /gym/oauth/consent (the OAuth consent
      # screen) get 404.html, which is the app itself.
      - run: cp apps/app/dist/index.html apps/app/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The API (with the MCP server) as a Supabase Edge Function, once typecheck and tests pass.
  # SUPABASE_ACCESS_TOKEN: a personal access token of the Supabase account, as a repository secret.
  api:
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase functions deploy api --use-api --project-ref dfrwksgqjykqkkxrjrct
