<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the page runs edge to edge and env(safe-area-inset-*) gives the system bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Absolute paths: 404.html is a copy of this page served on deeper paths such as /gym/oauth/consent. -->
    <link rel="manifest" href="/gym/manifest.json" />
    <link rel="apple-touch-icon" href="/gym/icon-192.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* The app's dark background everywhere: when the browser bar hides or shows, the strip
         the app does not cover yet keeps the same colour instead of the page default. */
      html,
      body,
      #root {
        background-color: #0f1115;
      }
      /* Full height, following the browser bar: 100dvh where supported, 100% otherwise. */
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
